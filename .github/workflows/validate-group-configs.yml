name: Validate group configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily (Blueprint Automation #6): fails if a past-event flyer still needs archiving.
    - cron: "17 11 * * *"

jobs:
  validate:
    name: Validate group.json examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/group-bootstrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/group-bootstrapper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate example configs
        run: npm test

      - name: Run validate-group-config.js harness (examples pass, bad fixtures fail)
        run: npm run test:harness

      - name: Run bootstrap-group.js generator tests (good fork generated, bad configs write nothing)
        run: npm run test:bootstrap

      - name: Check committed fork and regional site match a fresh build
        run: npm run check:generated

      - name: "Flyer archival tests (Automation #6)"
        run: npm run test:archive

      - name: No past-event flyers left unarchived
        run: npm run check:archive

      - name: "Flyer anonymity scanner + Group Struggles triage tests (Automations #5, #7)"
        run: npm run test:anon-triage

      - name: "Two-segment metrics roll-up tests (Automation #10)"
        run: npm run test:metrics

      - name: "Callback bridge stub tests, mocks only, no live telephony (Webhooks #1-#2)"
        run: npm run test:bridge
