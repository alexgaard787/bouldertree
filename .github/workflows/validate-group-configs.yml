name: Validate group configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate group.json examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/group-bootstrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/group-bootstrapper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate example configs
        run: npm test
